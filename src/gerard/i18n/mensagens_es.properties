pesq.d3.flow.regulation.readingIntro=Las lecturas se calcularon mediante tríos temporales S → C → S, es decir, acción del sujeto, intervención de la computadora y siguiente acción del sujeto. Se identificaron
pesq.d3.flow.regulation.nodeRule=En la red, el tamaño del nodo indica la cantidad de eventos de ese tipo y el grosor de la línea indica la cantidad de transiciones entre dos tipos de evento.
pesq.d3.flow.regulation.relevance=esta lectura muestra si las acciones de Gerard producen reorganización después del error o aparecen como ciclos repetidos de error y ayuda insuficiente.
pesq.d3.flow.regulation.meaning=La red indica cómo se encadenan los eventos durante la resolución. Transiciones frecuentes como error a feedback a acierto sugieren reorganización de la acción; transiciones como error a feedback a error pueden indicar ayuda insuficiente o mensaje ambiguo.
pesq.d3.flow.regulation.use=El investigador puede observar si la intervención de Gerard funciona como mediación o solo interrumpe la tarea. La red ayuda a identificar patrones de dependencia de la ayuda, persistencia del error y momentos en que la interfaz favorece la corrección después del feedback.
pesq.d3.flow.recurrence.readingIntro=Las lecturas se calcularon a partir de los tríos S → C → S en los que la primera acción del sujeto fue clasificada como error. Se identificaron
pesq.d3.flow.recurrence.triplets=tríos iniciados por error del sujeto.
pesq.d3.flow.recurrence.nodeRule=En la red, el tamaño del nodo indica la recurrencia de cada categoría y el grosor de la línea indica la frecuencia del encadenamiento entre error, intervención y acción posterior.
pesq.d3.flow.recurrence.relevance=esta lectura muestra en qué partes de la tarea el error tiende a persistir después de la intervención de la computadora y en qué momentos el sujeto logra retomar la resolución.
pesq.d3.flow.recurrence.meaning=Cuando la red concentra enlaces de error a intervención y luego a nuevo error, puede haber indicio de feedback insuficiente, pista poco específica o dificultad conceptual aún no superada. Cuando el camino avanza hacia el acierto, hay indicio de reorganización después de la mediación.
pesq.d3.flow.recurrence.use=El investigador puede localizar los puntos de Gerard en los que la ayuda necesita ser reformulada. La red también permite diferenciar error ocasional de patrón recurrente de dificultad, principalmente cuando el mismo tipo de tarea reaparece en varios problemas.
pesq.d3.flow.effectiveness.readingIntro=La lectura cruza cada intervención de la interfaz con la acción inmediatamente siguiente del sujeto. Se identificaron
pesq.d3.flow.effectiveness.interventions=intervenciones evaluables en el log.
pesq.d3.flow.effectiveness.matrixRule=En la matriz, las filas representan tipos de intervención de la computadora y las columnas representan la respuesta posterior del sujeto; valores mayores indican relaciones más recurrentes.
pesq.d3.flow.effectiveness.relevance=esta lectura permite evaluar si el feedback y el scaffolding de Gerard son seguidos por acierto, nuevo error, duda o acción neutra.
pesq.d3.flow.effectiveness.meaning=Intervenciones frecuentemente seguidas de acierto sugieren mediación productiva. Intervenciones seguidas de nuevo error pueden indicar ayuda insuficiente o ambigua. Intervenciones seguidas de duda pueden indicar reflexión aún no resuelta, y acciones neutras pueden indicar interrupción del flujo de la tarea.
pesq.d3.flow.effectiveness.use=El investigador puede comparar qué tipos de intervención deben mantenerse, ajustarse o sustituirse. La matriz ayuda a sustentar decisiones sobre el rediseño del feedback, del scaffolding y de los mensajes de regulación de la interfaz.
