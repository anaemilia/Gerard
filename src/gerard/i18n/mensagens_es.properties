pesq.d3.explain.benefitLabel=Cómo puede usarlo el investigador
pesq.d3.explain.heatmap.title=Lectura del mapa de calor
pesq.d3.explain.heatmap.meaning=En el ámbito de Gerard, la concentración de celdas indica qué problemas movilizan más aciertos, errores, feedbacks, ayudas o dudas. Un problema con muchas ocurrencias de error y ayuda puede indicar mayor dificultad de modelización, sobre todo en la relación entre el enunciado y el diagrama.
pesq.d3.explain.heatmap.benefit=El investigador puede localizar rápidamente problemas que exigen revisión del enunciado, de la categoría de Vergnaud, del mensaje de feedback o del scaffolding ofrecido. También puede comparar si ciertos tipos de error se concentran en composición, transformación o comparación.
pesq.d3.explain.flow.title=Lectura de la red de transiciones
pesq.d3.explain.flow.meaning=La red indica cómo se encadenan los eventos durante la resolución. Transiciones frecuentes como error a feedback a acierto sugieren reorganización de la acción; transiciones como error a feedback a error pueden indicar ayuda insuficiente o mensaje ambiguo.
pesq.d3.explain.flow.benefit=El investigador puede observar si la intervención de Gerard funciona como mediación o solo interrumpe la tarea. La red ayuda a identificar patrones de dependencia de la ayuda, persistencia del error y momentos en que la interfaz favorece la corrección después del feedback.
pesq.d3.explain.sequence.title=Lectura de la secuencia temporal
pesq.d3.explain.sequence.meaning=Cada línea muestra la sucesión de las acciones en una ocurrencia usuario/problema. Secuencias cortas con muchos aciertos sugieren fluidez; secuencias largas con alternancia de error, feedback y ayuda indican mayor costo interaccional y posible inestabilidad conceptual.
pesq.d3.explain.sequence.benefit=El investigador puede seguir el recorrido del usuario sin depender solo del total de errores. La visualización permite identificar en qué momento de la resolución aparece el error, si el usuario corrige después de la ayuda y si el problema exige muchas acciones hasta ser concluido.
pesq.d3.explain.exampleLabel=Ejemplo leído de la visualización
pesq.d3.explain.noExample=Todavía no hay suficientes datos para generar una lectura automática.
pesq.d3.explain.heatmap.rule=En el mapa de calor, el color identifica el tipo de evento y la intensidad de la celda indica la frecuencia: cuanto más oscura la celda, mayor la cantidad de ocurrencias.
pesq.d3.explain.flow.rule=En la red, el tamaño del nodo indica la cantidad de eventos de ese tipo y el grosor de la línea indica la cantidad de transiciones entre dos tipos de evento.
pesq.d3.explain.sequence.rule=En la secuencia temporal, la posición horizontal indica el orden de la acción; el color indica el tipo de evento; el borde oscuro indica acción de la computadora/interfaz.
pesq.d3.explain.colorLegend=Leyenda de colores: verde = acierto; rojo = error; naranja = feedback; azul = ayuda; morado = duda; gris = acción neutra; azul grisáceo = acción de la interfaz; grafito = acción del sujeto.
