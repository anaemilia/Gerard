pesq.visualizations.title=Visualizaciones D3 sugeridas por la IA a partir del log bruto
pesq.visualizations.desc=Estas visualizaciones se renderizan en D3.js dentro de Gerard, usando los eventos brutos del log. No repiten la Tabla 14; sintetizan patrones que la IA sugirió para apoyar el análisis: concentración de tipos de evento por problema, flujo entre error, feedback, ayuda y corrección, y secuencia temporal de las acciones por ocurrencia.
pesq.visualizations.aiNote=Sugerencias de la IA: 1) mapa de calor para localizar dónde se concentran errores, feedbacks, ayudas y aciertos; 2) red de transiciones para observar cómo una acción tiende a llevar a otra; 3) línea de secuencia para inspeccionar el orden de los eventos en cada ocurrencia.
