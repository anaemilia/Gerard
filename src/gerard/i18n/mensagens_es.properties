pesq.summary.text=Esta vista usa solo el modelo de análisis del estudio. Los números mostrados se generan a partir del uso real de Gerard. Cada acción relevante se guarda en un archivo TSV con las columnas: agente de la acción, problema, intento, tarea, C/E, instrumento, función del artefacto y reglas. Las pestañas y gráficos se recalculan a partir de estos archivos.\\n\\nArchivo de la sesión actual: {0}
pesq.t4.title=Tabla 4 - Identificación de los problemas utilizados en los datos analizados
pesq.t4.desc=Formato del estudio: rótulo del problema, tipo esperado y enunciado. La tabla se reconstruye a partir de los problemas presentes en el log; cuando el log no trae el enunciado, se usa el enunciado predeterminado correspondiente al rótulo analítico.
