pesq.t7.title=Tabla 7 - Objetos presentes en el contexto de la acción
pesq.t7.desc=Formato del estudio: identificación y descripción de los objetos. La tercera columna muestra cuántas veces el objeto aparece en los datos brutos; esto mantiene el sentido analítico de la tabla y agrega la consulta al log.
