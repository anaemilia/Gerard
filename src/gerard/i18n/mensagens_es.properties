pesq.t4.problem.01.statement=Alrededor de la mesa están sentados 4 niños y 7 niñas. ¿Cuántas personas están sentadas alrededor de la mesa?
pesq.t4.problem.02.statement=Ricardo salió de casa con 6 canicas. Al volver tenía dos canicas. ¿Qué pasó en el juego?
pesq.t4.problem.03.statement=María compró una caja de bombones por 4 reales y todavía le quedaron 4 reales. ¿Cuánto tenía antes de hacer la compra?
pesq.t4.problem.04.statement=Ricardo tiene 6 años, Carlos tiene 4 años más que él. ¿Cuántos años tiene Carlos?
pesq.t4.problem.05.statement=Carlos tiene 7 reales y Luiz tiene 6 reales menos que él. ¿Cuántos reales tiene Luiz?
pesq.t4.problem.06.statement=Ricardo tiene 9 juguetes, de los cuales una parte son autitos y la otra parte son muñecos. Sabiendo que hay 4 muñecos, ¿cuántos son los autitos?
pesq.t6.title=Tabla 6 - Cantidad de situaciones-problema analizadas y acciones por usuario
pesq.t6.desc=Formato del estudio: usuario, situaciones-problema analizadas y acciones del sujeto + computadora/interfaz. Los totales se recalculan leyendo todos los archivos TSV de log.
