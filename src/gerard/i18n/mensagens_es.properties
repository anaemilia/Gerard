pesq.d3.scaffold.inputNote=La línea del log se interpreta como una unidad mínima de análisis: agente, tarea, C/E, instrumento y reglas indican qué apoyos aparecen en esa acción.
pesq.d3.scaffold.rule=Regla visual: la línea vertical representa la acción seleccionada; los símbolos alrededor indican los tipos de scaffolding inferidos a partir de los campos de la línea del log.
pesq.d3.scaffold.relevance=Su relevancia para el investigador está en pasar del registro textual de la acción a una lectura visual del apoyo ofrecido, del error cometido y de la regla posiblemente movilizada.
pesq.d3.scaffold.examplePrefix=En la línea seleccionada del log
pesq.d3.scaffold.explain.title=Lectura de la representación por línea del log
pesq.d3.scaffold.explain.meaning=Esta visualización aproxima la figura de scaffolding al log real de Gerard. En lugar de representar un episodio fijo, usa una línea del log para mostrar qué apoyos, acciones e invariantes pueden estar presentes en ese momento de la interacción.
pesq.d3.scaffold.explain.benefit=El investigador puede seleccionar una línea específica y verificar cómo se traduce visualmente en tipos de scaffolding, comparando acción del sujeto, intervención de la interfaz, error, acierto y reglas de representación.
