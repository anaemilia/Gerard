pesq.t14.title=Tabla 14 - Cantidad de acciones agrupadas por problema en los datos analizados
pesq.t14.desc=Formato del estudio: problema, número de ocurrencias, acciones del sujeto, acciones de la computadora, total, aciertos, errores y acciones neutras. Esta tabla se calcula directamente a partir del log.
